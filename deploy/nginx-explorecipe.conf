# explorecipe.xmu-cuisine.club -> 反代 127.0.0.1:18082 (explorecipe / Python server.py)
# 先只写 HTTP，certbot --nginx 申请证书后会自动追加 443 + 跳转。

server {
    server_name explorecipe.xmu-cuisine.club;

    # server.py 内部 MAX_UPLOAD_BYTES = 12MB
    client_max_body_size 15m;

    # gpt-image-2 生成 ~30-50s，step-3.6 batch ~100-300s
    proxy_read_timeout    420s;
    proxy_send_timeout    420s;
    proxy_connect_timeout 30s;

    access_log /var/log/nginx/explorecipe.xmu-cuisine.club.access.log;
    error_log  /var/log/nginx/explorecipe.xmu-cuisine.club.error.log;

    location / {
        proxy_pass         http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
